services:
  postgres:
    image: postgres:16-alpine
    container_name: medcompare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medcompare
      POSTGRES_PASSWORD: medcompare
      POSTGRES_DB: medcompare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/postgres:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    container_name: medcompare-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
